packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  better-sqlite3: true
  electron: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  msw: false

overrides:
  # dbus-next's optional native helper passes Unix fds, which Jarvis never
  # does; it would pull node-gyp in for nothing.
  usocket: "-"
